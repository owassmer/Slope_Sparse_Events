name: join-check
on:
  push:
    branches: [diag-joins]
permissions:
  contents: read
env:
  PYTHONPATH: .
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  SLOPE_JEV_CACHE_ONLY: '1'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        job: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run slope evidence build akoustis_20240514
      - name: Four partitions of group 4, each stopping at its first cold/walked disagreement
        run: |
          for i in 0 1 2 3; do
            p=$(( ${{ matrix.job }} * 4 + i ))
            [ $p -lt 34 ] && (.venv/bin/python tools/diag/join_check.py tools/diag/plan4.json $p out > out-$p.txt 2>&1; echo "partition $p exit $?") &
          done
          wait
          grep -h -E 'DISAGREE|cache that alone|DONE' out/log-*.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: join-check-${{ matrix.job }}
          path: |
            out/log-*.txt
            out/disagree-*.pkl
          if-no-files-found: ignore
