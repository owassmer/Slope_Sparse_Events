<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ data.meta.borrower }} · Slope's line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#16181d; --mute:#5f6670; --faint:#9aa0a8; --rule:#e6e8eb; --teal:#0f5e63; --bank:#8a9199;
          --serif:"Source Serif 4", Georgia, serif; font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
          color:var(--ink); font-variant-numeric:tabular-nums; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; }
  main { max-width:1120px; margin:0 0 0 max(32px, calc((100vw - 1120px) / 2 - 80px)); padding:0 32px 80px 0; }
  section { min-height:0; padding:56px 0 40px; border-bottom:1px solid var(--rule); }
  h1, h2 { font-family:var(--serif); font-weight:600; letter-spacing:-.01em; margin:0 0 14px; }
  h1 { font-size:34px; line-height:1.15; } h2 { font-size:28px; line-height:1.2; }
  h3 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:0 0 8px; }
  p { margin:0 0 10px; max-width:70ch; }
  .mute { color:var(--mute); } .small { font-size:13px; }
  a { color:var(--teal); }
  button { font:inherit; cursor:pointer; }
  #tip { position:fixed; z-index:50; max-width:420px; background:#fff; border:1px solid #d5d8dc; border-radius:4px; padding:8px 11px;
         box-shadow:0 6px 18px rgba(0,0,0,.08); font-size:13px; line-height:1.45; pointer-events:none; display:none; }
  .hastip { cursor:help; text-decoration:underline dotted #b0b5bb; text-underline-offset:3px; }
  /* 1. the situation */
  #s-situation { padding-top:48px; }
  .sit { display:grid; grid-template-columns:minmax(0, 1fr) 330px; gap:48px; align-items:start; }
  .sit .question { font-family:var(--serif); font-size:23px; line-height:1.3; margin-top:18px; max-width:32ch; }
  .line { border-top:2px solid var(--ink); padding-top:12px; font-size:14px; }
  .line dl { display:grid; grid-template-columns:70px 1fr; gap:6px 10px; margin:0 0 12px; }
  .line dt { color:var(--mute); } .line dd { margin:0; }
  .line .rule { font-size:14px; }
  .facts { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); margin:26px 0 12px; }
  .facts div { padding:12px 16px 12px 0; display:flex; flex-direction:column; gap:2px; }
  .facts div + div { padding-left:16px; border-left:1px solid var(--rule); }
  .facts b { font-size:20px; font-weight:600; }
  /* 2. the dots */
  .drow { margin:18px 0 6px; }
  .dhead { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; font-size:15px; }
  .drow.research .dhead { color:var(--teal); } .drow.bank .dhead { color:#4b5158; }
  .dots { display:grid; grid-template-columns:repeat(100, minmax(0, 1fr)); gap:2px; }
  .dots i { display:block; aspect-ratio:1; border-radius:50%; cursor:pointer; }
  .dots i:hover { outline:2px solid var(--ink); outline-offset:1px; }
  .dleg { display:flex; flex-wrap:wrap; gap:4px 18px; margin-top:6px; font-size:13px; color:var(--mute); }
  .dleg i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .dleg b { color:var(--ink); font-weight:600; margin-left:2px; }
  table.cmp { border-collapse:collapse; width:100%; margin-top:22px; font-size:15px; }
  table.cmp th { font-weight:500; font-size:13px; color:var(--mute); text-align:right; padding:6px 10px; border-bottom:1px solid var(--ink); }
  table.cmp td { padding:8px 10px; border-bottom:1px solid var(--rule); text-align:right; }
  table.cmp td:first-child, table.cmp th:first-child { text-align:left; padding-left:0; }
  table.cmp th:nth-child(3), table.cmp td:nth-child(3) { color:var(--teal); font-weight:600; }
  table.cmp td:nth-child(2) { color:#4b5158; }
  .why { margin-top:16px; font-size:16px; max-width:78ch; }
  /* 3. the chart */
  svg.when { width:100%; display:block; overflow:visible; }
  svg { fill:var(--mute); } svg text { font-size:12px; font-family:inherit; }
  svg text.pin { font-size:12px; }
  svg text.end { font-size:13px; font-weight:600; } svg text.endv { font-size:13px; }
  svg text.ann { font-size:13px; font-weight:600; } svg text.ann2 { font-size:13px; }
  svg text.pin, svg text.ann, svg text.ann2 { stroke:#fff; stroke-width:4px; paint-order:stroke; stroke-linejoin:round; }
  .tt { display:flex; align-items:center; gap:6px; } .tt i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  table.pl { border-collapse:collapse; margin-top:6px; } table.pl td { padding:2px 0; vertical-align:top; }
  table.pl td:first-child { color:var(--mute); padding-right:10px; white-space:nowrap; }
  /* 4. the tree and the decision map */
  .thead { display:flex; justify-content:space-between; align-items:baseline; }
  .seg { display:inline-flex; border:1px solid #cfd3d8; border-radius:4px; overflow:hidden; }
  .seg button { border:0; background:#fff; padding:5px 14px; font-size:14px; color:var(--mute); }
  .seg button.on { background:var(--ink); color:#fff; }
  svg.tree { width:100%; display:block; }
  svg.tree .lk { fill:#dcdfe3; opacity:.8; } svg.tree .lk.f { fill:#efc9c0; } svg.tree .lk.q { fill:#cfe0d3; } svg.tree .nd.click { cursor:pointer; }
  svg.tree text.tn { font-size:12px; fill:var(--ink); } svg.tree text.tn.b { font-weight:600; } svg.tree text.tn.m { fill:var(--mute); }
  svg.tree.hl .lk { opacity:.3; } svg.tree.hl .nd { opacity:.45; }
  svg.tree.hl .lk.on { fill:#9cc3c5; opacity:1; } svg.tree.hl .nd.on { opacity:1; }
  svg.tree .nd.click:hover rect:first-child { stroke:var(--teal); stroke-width:1.5; }
  .lanes { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:14px; border-top:1px solid var(--rule); padding-top:12px; }
  .lane h3 { font-family:var(--serif); text-transform:none; letter-spacing:0; font-size:16px; color:var(--ink); margin:0 0 8px; }
  .forks { display:flex; flex-direction:column; gap:6px; }
  .fork { text-align:left; background:#fff; border:1px solid var(--rule); border-radius:4px; padding:6px 9px 7px; display:flex; flex-direction:column; gap:2px; font-size:12.5px; line-height:1.3; }
  .fork:hover { border-color:var(--teal); }
  .fork .fs { font-weight:600; font-size:13px; } .fork .fw, .fork .fa { color:var(--mute); font-size:11.5px; }
  .fork .sb { display:flex; height:5px; border-radius:3px; overflow:hidden; margin:3px 0 1px; } .fork .sb i { display:block; height:100%; }
  .fork .fb { font-size:12px; display:flex; flex-wrap:wrap; gap:0 8px; } .fork .fb span { white-space:nowrap; } .fork .fb i { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; }
  .tleg { display:flex; gap:20px; font-size:12.5px; color:var(--mute); margin:0 0 10px; }
  .tleg i { display:inline-block; width:12px; height:10px; margin-right:6px; vertical-align:-1px; border-radius:2px; }
  .tleg i.bar { width:4px; background:linear-gradient(#c2412d 50%, #dde0e4 50%); }
</style>
</head>
<body data-api="{{ api }}">
<script id="page-data" type="application/json">{{ data | tojson }}</script>
<main>
  <section id="s-situation"></section>
  <section id="s-futures"></section>
  <section id="s-when"></section>
  <section id="s-tree"></section>
  <section id="s-levers"></section>
  <section id="s-actual">
    {% if not dev %}<button id="actual"{% if not has_outcome %} disabled{% endif %}></button>{% endif %}
    <div id="actual-body"></div>
  </section>
  <footer id="s-foot">
    {% if has_record %}<a id="record" href="{{ record_url }}"></a>{% endif %}
    <div id="terms"></div>
  </footer>
</main>
<aside id="drawer" aria-hidden="true"></aside>
<div id="tip"></div>
<script src="/static/page.js"></script>
</body>
</html>
