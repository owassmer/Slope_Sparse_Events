<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ data.meta.borrower }} · Slope's line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#16181d; --mute:#5f6670; --faint:#9aa0a8; --rule:#e6e8eb; --teal:#1f3a5f; --bank:#8a9199;
          --serif:"Source Serif 4", Georgia, serif; font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
          color:var(--ink); font-variant-numeric:tabular-nums; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; }
  main { max-width:1120px; margin:0 0 0 max(32px, calc((100vw - 1120px) / 2 - 80px)); padding:0 32px 120px 0; }
  section { min-height:0; padding:56px 0 40px; border-bottom:1px solid var(--rule); }
  h1, h2 { font-family:var(--serif); font-weight:600; letter-spacing:-.01em; margin:0 0 14px; }
  h1 { font-size:34px; line-height:1.15; } h2 { font-size:28px; line-height:1.2; }
  h3 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:0 0 8px; }
  p { margin:0 0 10px; max-width:70ch; }
  .mute { color:var(--mute); } .small { font-size:13px; }
  a { color:var(--teal); }
  button { font:inherit; cursor:pointer; }
  #tip { position:fixed; z-index:50; max-width:420px; background:#fff; border:1px solid #d5d8dc; border-radius:4px; padding:8px 11px;
         box-shadow:0 6px 18px rgba(0,0,0,.08); font-size:13px; line-height:1.45; pointer-events:none; display:none; }
  .hastip { cursor:help; text-decoration:underline dotted #b0b5bb; text-underline-offset:3px; }
  /* 1. the situation */
  #s-situation { padding-top:48px; }
  .sit { display:grid; grid-template-columns:minmax(0, 1fr) 330px; gap:48px; align-items:start; }
  .sit .question { font-family:var(--serif); font-size:23px; line-height:1.3; margin-top:18px; max-width:32ch; }
  .line { border-top:2px solid var(--ink); padding-top:12px; font-size:14px; }
  .line dl { display:grid; grid-template-columns:70px 1fr; gap:6px 10px; margin:0 0 12px; }
  .line dt { color:var(--mute); } .line dd { margin:0; }
  .line .rule { font-size:14px; }
  .facts { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); margin:26px 0 12px; }
  .facts div { padding:12px 16px 12px 0; display:flex; flex-direction:column; gap:2px; }
  .facts div + div { padding-left:16px; border-left:1px solid var(--rule); }
  .facts b { font-size:20px; font-weight:600; }
  /* 2. the outcome grids */
  .grids { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:40px; margin-top:18px; }
  .ghead { display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; column-gap:14px; align-items:baseline; margin-bottom:12px; }
  .gname { grid-column:1 / 3; font-weight:600; font-size:15px; }
  .gblock.research .gname, .gblock.research .gbig { color:var(--teal); } .gblock.bank .gname, .gblock.bank .gbig { color:#4b5158; }
  .gbig { font-family:var(--serif); font-size:34px; font-weight:600; line-height:1.1; } .gsub { color:var(--mute); font-size:13px; }
  .gbody { display:grid; grid-template-columns:232px minmax(0, 1fr); gap:22px; align-items:start; }
  .waffle { display:grid; grid-template-columns:repeat(10, 20px); grid-auto-rows:20px; gap:3px; }
  .waffle i { display:block; border-radius:2px; cursor:pointer; }
  .waffle i:hover { outline:2px solid var(--ink); outline-offset:1px; }
  .gleg h4 { margin:0 0 4px; font-size:13px; font-weight:600; display:flex; justify-content:space-between; gap:8px; }
  .gleg h4 + ul + h4 { margin-top:12px; }
  .gleg ul { list-style:none; padding:0; margin:0; font-size:13px; color:var(--mute); }
  .gleg li { display:grid; grid-template-columns:12px 1fr auto; gap:7px; align-items:start; padding:2px 0; } .gleg li i { margin-top:4px; }
  .gleg li i { width:10px; height:10px; border-radius:2px; display:block; } .gleg li b { color:var(--ink); font-weight:600; }
  table.cmp { border-collapse:collapse; width:100%; margin-top:22px; font-size:15px; }
  table.cmp th { font-weight:500; font-size:13px; color:var(--mute); text-align:right; padding:6px 10px; border-bottom:1px solid var(--ink); }
  table.cmp td { padding:8px 10px; border-bottom:1px solid var(--rule); text-align:right; }
  table.cmp td:first-child, table.cmp th:first-child { text-align:left; padding-left:0; }
  table.cmp th:nth-child(3), table.cmp td:nth-child(3) { color:var(--teal); font-weight:600; }
  table.cmp td:nth-child(2) { color:#4b5158; }
  table.cmp td.good { color:#2f6b3f; } table.cmp td.bad { color:#a3261b; }
  .why { margin-top:16px; font-size:16px; max-width:78ch; }
  /* 3. the chart */
  svg.when { width:100%; display:block; overflow:visible; }
  svg { fill:var(--mute); } svg text { font-size:12px; font-family:inherit; }
  svg text.pin { font-size:12px; }
  svg text.end { font-size:13px; font-weight:600; } svg text.endv { font-size:13px; }
  svg text.ann { font-size:13px; font-weight:600; } svg text.ann2 { font-size:13px; }
  svg text.pin, svg text.ann, svg text.ann2 { stroke:#fff; stroke-width:4px; paint-order:stroke; stroke-linejoin:round; }
  .tt { display:flex; align-items:center; gap:6px; } .tt i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  table.pl { border-collapse:collapse; margin-top:6px; } table.pl td { padding:2px 0; vertical-align:top; }
  table.pl td:first-child { color:var(--mute); padding-right:10px; white-space:nowrap; }
  /* 4. the tree and the decision map */
  .thead { display:flex; justify-content:space-between; align-items:baseline; }
  .seg { display:inline-flex; border:1px solid #cfd3d8; border-radius:4px; overflow:hidden; }
  .seg button { border:0; background:#fff; padding:5px 14px; font-size:14px; color:var(--mute); }
  .seg button.on { background:var(--ink); color:#fff; }
  svg.tree { width:100%; display:block; }
  svg.tree .lk { fill:#dcdfe3; opacity:.8; } svg.tree .lk.f { fill:#efc9c0; } svg.tree .lk.q { fill:#cfe0d3; } svg.tree .nd.click { cursor:pointer; }
  svg.tree text.tn { font-size:12px; fill:var(--ink); } svg.tree text.tn.b { font-weight:600; } svg.tree text.tn.m { fill:var(--mute); }
  svg.tree.hl .lk { opacity:.3; } svg.tree.hl .nd { opacity:.45; }
  svg.tree.hl .lk.on { fill:#a9b8cc; opacity:1; }
  svg.tree text.cond { font-size:11px; fill:#6b7178; stroke:#fff; stroke-width:3px; paint-order:stroke; stroke-linejoin:round; } .nw { white-space:nowrap; } svg.tree text.colh { font-size:12px; font-weight:600; fill:var(--mute); text-transform:uppercase; letter-spacing:.05em; } svg.tree.hl .nd.on { opacity:1; }
  svg.tree .nd.click:hover rect:first-child { stroke:var(--teal); stroke-width:1.5; }
  .lanes { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:14px; border-top:1px solid var(--rule); padding-top:12px; }
  .lane h3 { font-family:var(--serif); text-transform:none; letter-spacing:0; font-size:16px; color:var(--ink); margin:0 0 8px; }
  .forks { display:flex; flex-direction:column; gap:6px; }
  .fork { text-align:left; background:#fff; border:1px solid var(--rule); border-radius:4px; padding:6px 9px 7px; display:flex; flex-direction:column; gap:2px; font-size:12.5px; line-height:1.3; }
  .fork:hover { border-color:var(--teal); }
  .fork .fs { font-weight:600; font-size:13px; } .fork .fw, .fork .fa { color:var(--mute); font-size:11.5px; }
  .fork .sb { display:flex; height:6px; border-radius:3px; overflow:hidden; margin:3px 0 1px; } .fork .sb i { display:block; height:100%; } .fork .sb i + i { border-left:2px solid #fff; }
  .fork .fb { font-size:12px; display:flex; flex-wrap:wrap; gap:0 8px; } .fork .fb span { white-space:nowrap; } .fork .fb i { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; }
  .tleg { display:flex; gap:20px; font-size:12.5px; color:var(--mute); margin:0 0 10px; }
  .tleg i { display:inline-block; width:12px; height:10px; margin-right:6px; vertical-align:-1px; border-radius:2px; }
  /* 5. the close-up */
  #drawer { position:fixed; top:0; right:0; bottom:0; width:440px; background:#fff; box-shadow:-10px 0 30px rgba(0,0,0,.12); border-left:1px solid var(--rule);
            overflow-y:auto; padding:22px 26px 40px; transform:translateX(105%); transition:transform .18s ease; z-index:40; font-size:14px; }
  #drawer.open { transform:none; }
  #drawer h2 { font-size:21px; margin:2px 0 10px; } #drawer h3 { margin:20px 0 6px; } #drawer > h3:first-of-type { margin-top:4px; } #drawer p { margin:0 0 8px; }
  dl.meta, dl.inputs { display:grid; grid-template-columns:185px 1fr; gap:3px 10px; margin:0 0 8px; font-size:13.5px; } dl.meta dt, dl.inputs dt { color:var(--mute); } dl.meta dd, dl.inputs dd { margin:0; }
 dl.inputs dd { font-variant-numeric:tabular-nums; }
  .sw { position:relative; } .sw .jm { position:absolute; top:22px; width:2px; height:9px; background:var(--ink); transform:translateX(-1px); pointer-events:none; }
  table.eff { border-collapse:collapse; width:100%; font-size:13.5px; } table.eff th { font-weight:500; color:var(--mute); text-align:right; padding:4px 6px; border-bottom:1px solid var(--rule); white-space:nowrap; }
  table.eff td { text-align:right; padding:5px 6px; border-bottom:1px solid var(--rule); font-weight:600; } table.eff td:first-child, table.eff th:first-child { text-align:left; padding-left:0; font-weight:400; color:var(--mute); }
  table.eff .j { color:var(--teal); }
  #drawer .x { position:absolute; top:12px; right:14px; border:0; background:none; font-size:24px; color:var(--mute); line-height:1; }
  #drawer .who { font-size:13px; color:var(--mute); } #drawer .who b { color:var(--ink); }
  blockquote { margin:0 0 12px; padding:0 0 0 12px; border-left:2px solid #d5d8dc; font-family:var(--serif); font-size:13.5px; line-height:1.45; }
  blockquote p { margin:0 0 3px; } cite { font-style:normal; font-family:-apple-system, sans-serif; font-size:12px; color:var(--mute); }
  .ans { display:flex; align-items:baseline; gap:8px; font-size:16px; } .ans .big { font-family:var(--serif); font-size:30px; font-weight:600; color:var(--teal); }
  .split { display:flex; height:8px; border-radius:4px; overflow:hidden; margin:6px 0 4px; } .split i { display:block; height:100%; }
  .slabs { display:flex; justify-content:space-between; font-size:12.5px; color:var(--mute); gap:8px; }
  #d-slider { width:100%; margin:12px 0 4px; accent-color:var(--teal); }
  .pick { display:flex; flex-wrap:wrap; gap:4px 12px; margin:0 0 8px; font-size:13px; }
  details.law { margin-top:20px; font-size:13px; } details summary { cursor:pointer; font-weight:600; color:var(--mute); }
  .step { display:grid; grid-template-columns:62px 1fr; gap:8px; padding:6px 0; border-bottom:1px solid var(--rule); }
  .tag { font-size:11px; font-weight:600; color:var(--mute); text-transform:uppercase; letter-spacing:.04em; }
  .others { display:flex; flex-direction:column; gap:6px; }
  .others button { text-align:left; border:1px solid var(--rule); background:#fff; border-radius:4px; padding:7px 9px; display:flex; justify-content:space-between; gap:10px; font-size:13px; }
  .others button:hover { border-color:var(--teal); } .others b { white-space:nowrap; font-weight:600; }
  /* 6. the levers */
  .levers { display:flex; flex-direction:column; margin-top:12px; }
  .lever { display:grid; grid-template-columns:minmax(0, 1fr) 560px; gap:4px 24px; align-items:center; text-align:left; background:none; border:0; border-top:1px solid var(--rule); padding:14px 0; font:inherit; color:inherit; cursor:pointer; }
  .lever:hover .ll b { color:var(--teal); text-decoration:underline; }
  .lever .ll { display:flex; flex-direction:column; min-width:0; } .lever .lm { font-size:13px; color:var(--mute); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .lever .lt { position:relative; height:22px; margin:0 84px; background:linear-gradient(#e6e8eb, #e6e8eb) center/100% 1px no-repeat; }
  .lever .rng { position:absolute; top:6px; height:10px; background:#c3cfdd; border-radius:5px; }
  .lever .mk { position:absolute; top:1px; width:3px; height:20px; background:var(--teal); transform:translateX(-50%); }
  .lever .mkl { position:absolute; top:-17px; transform:translateX(-50%); font-size:12px; color:var(--teal); white-space:nowrap; font-weight:600; }
  .lever .endl, .lever .endr { position:absolute; top:2px; font-size:12.5px; color:var(--mute); white-space:nowrap; background:#fff; }
  .lever .endl { padding-right:6px; } .lever .endr { padding-left:6px; } .lever .endl b, .lever .endr b { color:var(--ink); font-weight:600; }
  .levers .lever:first-child { padding-top:30px; }
  svg text.band { font-size:12px; font-style:italic; }
  /* 7. what happened, the footer */
  #actual { margin-bottom:14px; border:1px solid var(--ink); background:#fff; padding:8px 16px; border-radius:4px; font-size:15px; }
  #actual:disabled { opacity:.4; cursor:default; }
  .filed { font-family:var(--serif); font-size:19px; margin:16px 0; }
  ol.events { list-style:none; padding:0; margin:0; max-width:880px; } ol.events li { display:grid; grid-template-columns:110px 1fr; gap:12px; padding:6px 0; border-bottom:1px solid var(--rule); font-size:14px; }
  footer { padding:28px 0 60px; font-size:14px; display:flex; flex-direction:column; gap:12px; }
  table.terms { border-collapse:collapse; font-size:13px; } table.terms td { padding:4px 12px 4px 0; border-bottom:1px solid var(--rule); vertical-align:top; }
  #changed { position:fixed; left:24px; bottom:20px; background:var(--ink); color:#fff; padding:9px 14px; border-radius:4px; font-size:13.5px; z-index:45; }
  #changed a { color:#b9c8dc; margin-left:8px; }
</style>
</head>
<body data-api="{{ api }}">
<script id="page-data" type="application/json">{{ data | tojson }}</script>
<main>
  <section id="s-situation"></section>
  <section id="s-futures"></section>
  <section id="s-when"></section>
  <section id="s-tree"></section>
  <section id="s-levers"></section>
  <section id="s-actual">
    {% if not dev %}<button id="actual"{% if not has_outcome %} disabled{% endif %}></button>{% endif %}
    <div id="actual-body"></div>
  </section>
  <footer id="s-foot">
    {% if has_record %}<a id="record" href="{{ record_url }}"></a>{% endif %}
    <div id="terms"></div>
  </footer>
</main>
<aside id="drawer" aria-hidden="true"></aside>
<div id="changed" hidden></div>
<div id="tip"></div>
<script src="/static/page.js"></script>
</body>
</html>
