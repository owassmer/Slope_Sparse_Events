[package]
name = "slope-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Deterministic native execution core for Slope Sparse Events"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "=0.27.2" }
numpy = "=0.27.1"
ndarray = "=0.17.2"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
